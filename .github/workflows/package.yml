name: Package

# Builds the os-arpwatch package in a FreeBSD VM using the OPNsense plugins
# build system. Pushing a tag like v1.0 also publishes it as a release.
#
# Third party actions are pinned to a commit, and the build runs with a read
# only token: only the small release job below may write to the repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build package in FreeBSD
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: '14'
          prepare: pkg install -y git
          run: |
            set -e
            git clone --depth 1 https://github.com/opnsense/plugins.git /tmp/plugins
            PLUGIN=/tmp/plugins/net-mgmt/arpwatch
            rm -rf "${PLUGIN}"
            mkdir -p "${PLUGIN}"
            cp -R Makefile pkg-descr src "${PLUGIN}/"
            cd "${PLUGIN}"

            # the master branch of the plugins tree builds "-devel" packages unless told otherwise
            VERSION=$(make PLUGIN_DEVEL= -V PLUGIN_PKGVERSION)
            if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
                echo "tag ${GITHUB_REF_NAME} does not match PLUGIN_VERSION ${VERSION} in the Makefile" >&2
                exit 1
            fi

            make package PLUGIN_DEVEL= PLUGIN_HASH="$(echo "${GITHUB_SHA}" | cut -c1-9)"

            mkdir -p "${GITHUB_WORKSPACE}/dist"
            cp work/pkg/*.pkg "${GITHUB_WORKSPACE}/dist/"
            for PKG in work/pkg/*.pkg; do
                pkg info -F "${PKG}"
                tar -tvf "${PKG}"
            done

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: os-arpwatch
          path: dist/*.pkg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: os-arpwatch
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.pkg --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
