[start]
command:/usr/local/etc/rc.d/arpwatchd start
parameters:
type:script
message:starting arpwatch

[stop]
command:/usr/local/etc/rc.d/arpwatchd stop
parameters:
type:script
message:stopping arpwatch

[restart]
command:/usr/local/etc/rc.d/arpwatchd restart
parameters:
type:script
message:restarting arpwatch

[status]
command:/usr/local/etc/rc.d/arpwatchd status; exit 0
parameters:
type:script_output
message:request arpwatch status

[list]
command:/usr/local/opnsense/scripts/OPNsense/Arpwatch/hosts.py list
parameters:
type:script_output
message:list arpwatch devices

[delete]
command:/usr/local/opnsense/scripts/OPNsense/Arpwatch/hosts.py delete
parameters:%s
type:script_output
message:forget arpwatch device %s

[flush]
command:/usr/local/opnsense/scripts/OPNsense/Arpwatch/hosts.py flush
parameters:
type:script_output
message:flush arpwatch device database

[test]
command:/usr/local/opnsense/scripts/OPNsense/Arpwatch/testnotify.py
parameters:
type:script_output
message:send arpwatch test notification
