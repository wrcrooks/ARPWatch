# DO NOT EDIT THIS FILE -- OPNsense auto-generated file
{% if helpers.exists('OPNsense.arpwatch.general') %}
{%   set general = OPNsense.arpwatch.general %}
[general]
{%   if general.interfaces|default('') != '' %}
interfaces={% for intf in general.interfaces.split(',') %}{{ intf }}|{{ helpers.physical_interface(intf) }}{% if not loop.last %},{% endif %}{% endfor %}

{%   else %}
interfaces=
{%   endif %}
interval={{ general.interval|default('30') }}
ipv6={{ general.ipv6|default('1') }}
silent_seed={{ general.silent_seed|default('1') }}
notify_new_mac={{ general.notify_new_mac|default('1') }}
notify_new_ip={{ general.notify_new_ip|default('0') }}
notify_mac_changed={{ general.notify_mac_changed|default('1') }}
ignore_macs={{ general.ignore_macs|default('') }}
{% endif %}
{% if helpers.exists('OPNsense.arpwatch.notifications') %}
{%   set notify = OPNsense.arpwatch.notifications %}

[smtp]
enabled={{ notify.smtp_enabled|default('0') }}
host={{ notify.smtp_host|default('') }}
port={{ notify.smtp_port|default('587') }}
security={{ notify.smtp_security|default('starttls') }}
username={{ notify.smtp_username|default('') }}
password={{ notify.smtp_password|default('') }}
from={{ notify.smtp_from|default('') }}
to={{ notify.smtp_to|default('') }}

[telegram]
enabled={{ notify.telegram_enabled|default('0') }}
token={{ notify.telegram_token|default('') }}
chat_id={{ notify.telegram_chat_id|default('') }}

[pushbullet]
enabled={{ notify.pushbullet_enabled|default('0') }}
token={{ notify.pushbullet_token|default('') }}
channel={{ notify.pushbullet_channel|default('') }}
{% endif %}
